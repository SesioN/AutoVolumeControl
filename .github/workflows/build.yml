name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create and publish as a release (e.g. v1.7.0); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AutoVolumeControl.sln

      - name: Build
        run: dotnet build AutoVolumeControl.sln -c Release --no-restore

      - name: Test
        run: dotnet test AutoVolumeControl.sln -c Release --no-build --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoVolumeControl
          path: src/AutoVolumeControl/bin/Release/net48/AutoVolumeControl.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AutoVolumeControl

      # Notes: .github/release-notes/<tag>.md if it exists, else the tag's section of CHANGELOG.md; then the checksum.
      - name: Release notes
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            cat "$notes" > release-notes.md
          else
            awk -v v="${TAG#v}" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          {
            echo
            echo "## Checksum"
            echo
            echo "SHA-256 of \`AutoVolumeControl.exe\`:"
            echo '```'
            sha256sum AutoVolumeControl.exe | cut -d' ' -f1
            echo '```'
          } >> release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: AutoVolumeControl ${{ env.TAG }}
          files: AutoVolumeControl.exe
          body_path: release-notes.md
